<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KoalaSteps - Compteur de Pas Rose &amp; Flammes</title>
  <style>
    :root {
      --bg-pink-1: #fff5f8;
      --bg-pink-2: #ffe4ee;
      --card-bg: #ffffff;
      --pink-soft: #ffd1e2;
      --pink-accent: #ff5c93;
      --pink-dark: #c92a67;
      --text-main: #4a1c30;
      --text-muted: #8c526a;
      --flame-orange: #ff7a2f;
      --gold: #f59e0b;
      --shadow: 0 10px 25px rgba(201, 42, 103, 0.12);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--bg-pink-1) 0%, var(--bg-pink-2) 100%);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--pink-soft);
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .koala-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ffe9f1;
      border: 2.5px solid #ffb3ce;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .koala-btn:active { transform: scale(0.92); }
    .koala-bounce { animation: bounce 0.5s ease; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px) scale(1.06); }
    }
    .title-area h1 {
      margin: 0;
      font-size: 1.35rem;
      color: var(--pink-dark);
    }
    .koala-speech {
      margin: 4px 0 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .account-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff0f5;
      color: var(--pink-dark);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .btn {
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-pink {
      background: linear-gradient(135deg, #ff6fa1, #e83e80);
      color: #fff;
      width: 100%;
    }
    .btn-soft {
      background: #ffe6ef;
      color: var(--pink-dark);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    .stat-val {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--pink-dark);
      margin-top: 4px;
    }
    .stat-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .steps-hero {
      text-align: center;
    }
    .steps-big {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--pink-dark);
      margin: 4px 0;
    }
    .progress-wrap {
      background: #ffe6ef;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0 6px;
    }
    .progress-bar {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #ff85b1, #ff4788);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .quick-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .goal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    select, input {
      border: 1.5px solid #ffc2d8;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 0.9rem;
      color: var(--text-main);
      background: #fff9fb;
      outline: none;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 1.05rem;
      color: var(--pink-dark);
    }
    .add-friend-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffe6ef;
      color: var(--pink-dark);
      border: 1.5px solid #ffb8d2;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .friend-form {
      display: none;
      gap: 8px;
      margin-bottom: 12px;
    }
    .friend-form.open { display: flex; }
    .friend-form input { flex: 1; }
    .friend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #fff6f9;
      border: 1px solid #ffd8e6;
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .friend-name { font-weight: 700; font-size: 0.95rem; }
    .friend-steps { font-size: 0.8rem; color: var(--text-muted); }
    .flame-badge {
      background: #fff0e6;
      color: #d94e00;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(74, 28, 48, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border: 2px solid #ffb8d2;
      border-radius: 22px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
    }
    .modal h3 { margin: 0 0 12px; color: var(--pink-dark); }
    .modal-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .modal-field label { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); }
    .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #4a1c30;
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 60;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="header">
        <button class="koala-btn" id="koalaBtn" title="Cliquer sur le petit koala">
          <svg width="54" height="54" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="22" cy="34" r="18" fill="#9ca3af"/>
            <circle cx="22" cy="34" r="10" fill="#fbcfe8"/>
            <circle cx="78" cy="34" r="18" fill="#9ca3af"/>
            <circle cx="78" cy="34" r="10" fill="#fbcfe8"/>
            <ellipse cx="50" cy="54" rx="32" ry="29" fill="#b0b7c3"/>
            <circle cx="38" cy="48" r="4.2" fill="#1f2937"/>
            <circle cx="62" cy="48" r="4.2" fill="#1f2937"/>
            <circle cx="39.3" cy="46.8" r="1.3" fill="#ffffff"/>
            <circle cx="63.3" cy="46.8" r="1.3" fill="#ffffff"/>
            <ellipse cx="31" cy="57" rx="5.5" ry="3.2" fill="#f9a8d4" opacity="0.8"/>
            <ellipse cx="69" cy="57" rx="5.5" ry="3.2" fill="#f9a8d4" opacity="0.8"/>
            <ellipse cx="50" cy="57" rx="6.5" ry="9" fill="#374151"/>
            <path d="M44 69 Q50 74 56 69" stroke="#374151" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M62 72 Q74 68 78 75 Q70 80 62 72 Z" fill="#4ade80"/>
          </svg>
        </button>
        <div class="title-area" style="flex:1;">
          <h1>KoalaSteps</h1>
          <div class="koala-speech" id="koalaSpeech">Courage ! Chaque tranche de 1 000 pas te rapporte 10 pts.</div>
          <div class="account-pill" id="accountPill">Mode invité (local)</div>
          <button class="btn btn-pink" id="openAuthBtn">Inscription / Connexion</button>
        </div>
      </div>
    </div>

    <div class="card steps-hero">
      <div class="stat-label">Pas du jour</div>
      <div class="steps-big" id="stepsDisplay">2 450 pas</div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="stat-sub" id="nextTierText">Encore 550 pas pour le prochain palier (+10 pts)</div>

      <div class="quick-row">
        <button class="btn btn-soft" onclick="addSteps(500)">+ 500 pas</button>
        <button class="btn btn-soft" onclick="addSteps(1000)">+ 1 000 pas</button>
        <button class="btn btn-soft" onclick="resetToday()">Remettre à 0</button>
      </div>

      <div class="goal-row">
        <label for="goalSelect">Objectif flamme du jour :</label>
        <select id="goalSelect" onchange="updateUI()">
          <option value="3000">3 000 pas</option>
          <option value="5000" selected>5 000 pas</option>
          <option value="7000">7 000 pas</option>
          <option value="10000">10 000 pas</option>
        </select>
      </div>

      <button class="btn btn-pink" onclick="validateDay()">Valider mes pas du jour</button>
    </div>

    <div class="stats-grid">
      <div class="card">
        <div class="stat-label">Paliers (1 000 pas)</div>
        <div class="stat-val" id="tiersDisplay">2 palier(s)</div>
        <div class="stat-sub" id="pendingPtsText">+20 pts à valider</div>
      </div>
      <div class="card">
        <div class="stat-label">Solde &amp; Flammes</div>
        <div class="stat-val" id="totalPtsDisplay">140 pts</div>
        <div class="stat-sub" id="flamesDisplay">4 jours de flamme</div>
      </div>
    </div>

    <div class="card">
      <div class="section-head">
        <h2>Amis &amp; Flammes duo</h2>
        <button class="add-friend-btn" onclick="toggleFriendForm()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          Ajouter un ami
        </button>
      </div>

      <div class="friend-form" id="friendForm">
        <input type="text" id="friendNameInput" placeholder="Prénom ou pseudo..." />
        <button class="btn btn-pink" style="width:auto;" onclick="addFriend()">OK</button>
      </div>

      <div id="friendsList"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="authModal">
    <div class="modal">
      <h3>Compte KoalaSteps</h3>
      <div class="modal-field">
        <label for="emailInput">Adresse e-mail</label>
        <input type="email" id="emailInput" placeholder="exemple@mail.com" />
      </div>
      <div class="modal-field">
        <label for="passInput">Mot de passe</label>
        <input type="password" id="passInput" placeholder="Votre mot de passe" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-pink" onclick="saveAccount()">S'inscrire / Connexion</button>
        <button class="btn btn-soft" onclick="closeAuth()">Fermer</button>
      </div>
      <div style="margin-top:8px;">
        <button class="btn btn-soft" style="width:100%; font-size:0.8rem;" onclick="logoutAccount()">Se déconnecter</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'koalasteps_data_v1';
    let state = {
      email: '',
      stepsToday: 2450,
      totalPoints: 140,
      flames: 4,
      goal: 5000,
      friends: [
        { name: 'Lolita', steps: 3800, streak: 4 }
      ]
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) state = { ...state, ...JSON.parse(saved) };
      } catch (e) {}
      document.getElementById('goalSelect').value = String(state.goal || 5000);
    }

    function persistState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function bounceKoala(text) {
      const btn = document.getElementById('koalaBtn');
      btn.classList.remove('koala-bounce');
      void btn.offsetWidth;
      btn.classList.add('koala-bounce');
      if (text) document.getElementById('koalaSpeech').textContent = text;
    }

    document.getElementById('koalaBtn').addEventListener('click', () => {
      const msgs = [
        "Super rythme ! Continue comme ça !",
        "Chaque 1 000 pas = +10 points dans ta poche !",
        "Ton petit koala est fier de toi !"
      ];
      bounceKoala(msgs[Math.floor(Math.random() * msgs.length)]);
    });

    function addSteps(amount) {
      state.stepsToday += amount;
      persistState();
      updateUI();
      bounceKoala("+" + amount.toLocaleString('fr-FR') + " pas ajoutés !");
    }

    function resetToday() {
      state.stepsToday = 0;
      persistState();
      updateUI();
      showToast("Compteur du jour remis à 0");
    }

    function validateDay() {
      state.goal = parseInt(document.getElementById('goalSelect').value, 10);
      const tiers = Math.floor(state.stepsToday / 1000);
      const earned = tiers * 10;
      if (state.stepsToday <= 0) {
        showToast("Ajoute d'abord quelques pas !");
        return;
      }
      state.totalPoints += earned;
      if (state.stepsToday >= state.goal) {
        state.flames += 1;
        state.friends = state.friends.map(f => ({ ...f, streak: f.streak + 1 }));
        bounceKoala("Bravo ! +" + earned + " pts et +1 flamme validée !");
        showToast("Journée validée : +" + earned + " pts et flamme +1 !");
      } else {
        bounceKoala("+" + earned + " pts encaissés ! Atteins l'objectif pour la flamme.");
        showToast("+" + earned + " pts ajoutés (objectif flamme non atteint)");
      }
      state.stepsToday = 0;
      persistState();
      updateUI();
    }

    function toggleFriendForm() {
      document.getElementById('friendForm').classList.toggle('open');
    }

    function addFriend() {
      const input = document.getElementById('friendNameInput');
      const name = input.value.trim();
      if (!name) return;
      state.friends.push({ name, steps: 1200, streak: 1 });
      input.value = '';
      document.getElementById('friendForm').classList.remove('open');
      persistState();
      updateUI();
      bounceKoala(name + " a rejoint tes flammes de pas !");
    }

    document.getElementById('openAuthBtn').addEventListener('click', () => {
      document.getElementById('emailInput').value = state.email || '';
      document.getElementById('authModal').classList.add('open');
    });

    function closeAuth() {
      document.getElementById('authModal').classList.remove('open');
    }

    function saveAccount() {
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passInput').value.trim();
      if (!email || !pass) {
        showToast("Renseigne un e-mail et un mot de passe");
        return;
      }
      state.email = email;
      persistState();
      closeAuth();
      updateUI();
      showToast("Compte enregistré : " + email);
    }

    function logoutAccount() {
      state.email = '';
      persistState();
      closeAuth();
      updateUI();
      showToast("Déconnecté");
    }

    function updateUI() {
      state.goal = parseInt(document.getElementById('goalSelect').value, 10);
      const tiers = Math.floor(state.stepsToday / 1000);
      const pendingPts = tiers * 10;
      const remainder = state.stepsToday % 1000;
      const toNext = 1000 - remainder;
      const pct = Math.min(100, Math.round((remainder / 1000) * 100));

      document.getElementById('stepsDisplay').textContent = state.stepsToday.toLocaleString('fr-FR') + ' pas';
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('nextTierText').textContent =
        'Encore ' + toNext.toLocaleString('fr-FR') + ' pas pour le prochain palier (+10 pts)';
      document.getElementById('tiersDisplay').textContent = tiers + ' palier(s)';
      document.getElementById('pendingPtsText').textContent = '+' + pendingPts + ' pts à valider';
      document.getElementById('totalPtsDisplay').textContent = state.totalPoints + ' pts';
      document.getElementById('flamesDisplay').textContent = state.flames + ' jour(s) de flamme';
      document.getElementById('accountPill').textContent =
        state.email ? 'Connecté : ' + state.email : 'Mode invité (local)';

      const list = document.getElementById('friendsList');
      list.innerHTML = '';
      state.friends.forEach(friend => {
        const div = document.createElement('div');
        div.className = 'friend-item';
        div.innerHTML = `
          <div>
            <div class="friend-name">${friend.name}</div>
            <div class="friend-steps">${friend.steps.toLocaleString('fr-FR')} pas aujourd'hui</div>
          </div>
          <div class="flame-badge">${friend.streak} j</div>
        `;
        list.appendChild(div);
      });
    }

    loadState();
    updateUI();
  </script>
</body>
</html>
